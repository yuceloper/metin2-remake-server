services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${METIN2_POSTGRES_DB:-metin2}
      POSTGRES_USER: ${METIN2_POSTGRES_USER:-metin2}
      POSTGRES_PASSWORD: ${METIN2_POSTGRES_PASSWORD:-metin2-dev-only}
    ports:
      - "${METIN2_POSTGRES_PORT:-5432}:5432"
    volumes:
      - metin2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METIN2_POSTGRES_USER:-metin2} -d ${METIN2_POSTGRES_DB:-metin2}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
    command: ["serve", "--mode", "auth", "--bind", "0.0.0.0", "--port", "11002"]
    environment:
      METIN2_POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${METIN2_POSTGRES_DB:-metin2};Username=${METIN2_POSTGRES_USER:-metin2};Password=${METIN2_POSTGRES_PASSWORD:-metin2-dev-only}
      METIN2_SEED_DEVELOPMENT_ACCOUNT: "true"
      METIN2_PACKET_ENCRYPTION: ${METIN2_PACKET_ENCRYPTION:-none}
      METIN2_DEV_USERNAME: ${METIN2_DEV_USERNAME:-test}
      METIN2_DEV_PASSWORD: ${METIN2_DEV_PASSWORD:-test1234}
    ports:
      - "${METIN2_AUTH_PORT:-11002}:11002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  game:
    build:
      context: .
    command: ["serve", "--mode", "game", "--bind", "0.0.0.0", "--port", "13000"]
    environment:
      METIN2_POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${METIN2_POSTGRES_DB:-metin2};Username=${METIN2_POSTGRES_USER:-metin2};Password=${METIN2_POSTGRES_PASSWORD:-metin2-dev-only}
      METIN2_ADVERTISED_ADDRESS: ${METIN2_ADVERTISED_ADDRESS:-127.0.0.1}
      METIN2_PACKET_ENCRYPTION: ${METIN2_PACKET_ENCRYPTION:-none}
    ports:
      - "${METIN2_GAME_PORT:-13000}:13000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metin2-postgres-data:
