name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metin2_test
          POSTGRES_USER: metin2_test
          POSTGRES_PASSWORD: metin2-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metin2_test -d metin2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      METIN2_TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=metin2_test;Username=metin2_test;Password=metin2-test-password;Pooling=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Metin2.sln

      - name: Build Debug
        run: dotnet build Metin2.sln --configuration Debug --no-restore

      - name: Test Debug
        run: dotnet test --solution Metin2.sln --configuration Debug --no-build

      - name: Build Release
        run: dotnet build Metin2.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test --solution Metin2.sln --configuration Release --no-build
